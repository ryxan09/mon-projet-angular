<div class="board">

<p *ngIf="loading" role="status">Loading tasks...</p>
<p *ngIf="errorMessage" role="alert">{{errorMessage}}</p>


<div *ngIf="editingTask" class="edit-backdrop" (click)="cancel()">

<section class="edit-box" role="dialog" aria-modal="true" aria-labelledby="edit-task-title" (click)="$event.stopPropagation()">

<div class="edit-heading">
<div>
<p class="edit-eyebrow">TASK DETAILS</p>
<h3 id="edit-task-title">Edit task</h3>
</div>
<button class="close-edit" type="button" aria-label="Close edit panel" (click)="cancel()" [disabled]="saving">×</button>
</div>

<div class="edit-fields">
<label for="edit-task-name">Title</label>
<input id="edit-task-name" [(ngModel)]="editingTask.title" placeholder="Give your task a name">

<label for="edit-task-description">Description</label>
<textarea id="edit-task-description" [(ngModel)]="editingTask.description" placeholder="Add a few details"></textarea>

<label for="edit-task-status">Status</label>
<select id="edit-task-status" [(ngModel)]="editingTask.status">
<option value="TODO">TODO</option>
<option value="DOING">DOING</option>
<option value="DONE">DONE</option>
</select>
</div>

<div class="edit-buttons">
<button class="cancel" type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
<button class="save" type="button" (click)="save()" [disabled]="saving || !editingTask.title.trim()">{{saving ? 'Saving...' : 'Save changes'}}</button>
</div>

</section>
</div>




<div class="column todo">

<h3>TO DO</h3>

<div *ngFor="let task of tasks">
<div *ngIf="task.status==='TODO'" class="task-card todo-card">

<div class="color"></div>

<div class="task-content">

<div class="task-header">

<h4>{{task.title}}</h4>

<div class="buttons">
<button class="edit" (click)="edit(task)" [disabled]="deletingTaskId === task.id">✏</button>
<button class="delete" (click)="delete(task.id)" [disabled]="deletingTaskId === task.id">{{deletingTaskId === task.id ? '…' : '✕'}}</button>
</div>

</div>

<p>{{task.description}}</p>

</div>

</div>
</div>

</div>




<div class="column doing">

<h3>DOING</h3>

<div *ngFor="let task of tasks">
<div *ngIf="task.status==='DOING'" class="task-card doing-card">

<div class="color"></div>

<div class="task-content">

<div class="task-header">

<h4>{{task.title}}</h4>

<div class="buttons">
<button class="edit" (click)="edit(task)" [disabled]="deletingTaskId === task.id">✏</button>
<button class="delete" (click)="delete(task.id)" [disabled]="deletingTaskId === task.id">{{deletingTaskId === task.id ? '…' : '✕'}}</button>
</div>

</div>

<p>{{task.description}}</p>

</div>

</div>
</div>

</div>




<div class="column done">

<h3>DONE</h3>

<div *ngFor="let task of tasks">
<div *ngIf="task.status==='DONE'" class="task-card done-card">

<div class="color"></div>

<div class="task-content">

<div class="task-header">

<h4>{{task.title}}</h4>

<div class="buttons">
<button class="edit" (click)="edit(task)" [disabled]="deletingTaskId === task.id">✏</button>
<button class="delete" (click)="delete(task.id)" [disabled]="deletingTaskId === task.id">{{deletingTaskId === task.id ? '…' : '✕'}}</button>
</div>

</div>

<p>{{task.description}}</p>

</div>

</div>
</div>

</div>

</div>
